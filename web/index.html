<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Depto</title>
  <meta name="description" content="Todos los avisos de departamentos, PH, casas y locales en un solo lugar.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Depto">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Depto</span>
      <button id="installBtn" class="pill ghostpill hidden" type="button">Instalar</button>
      <button id="viewBtn" class="pill" type="button" aria-pressed="false">🗺 Mapa</button>
    </div>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Buscar barrio, calle, palabra…" autocomplete="off" enterkeyhint="search">
      <button id="filtersBtn" class="iconbtn" type="button" aria-label="Filtros">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <span id="filterCount" class="badge hidden"></span>
      </button>
    </div>
    <nav class="chips tabs" id="opChips" aria-label="Operación">
      <button data-op="venta" class="chip on">Comprar</button>
      <button data-op="alquiler" class="chip">Alquilar</button>
      <button data-op="fav" class="chip">♥ Guardados</button>
    </nav>
    <div class="pricebar" id="pricebar">
      <select id="pcur" aria-label="Moneda"><option value="USD">USD</option><option value="ARS">$</option></select>
      <input id="pmin" type="number" inputmode="numeric" placeholder="Precio mín." aria-label="Precio mínimo">
      <input id="pmax" type="number" inputmode="numeric" placeholder="Precio máx." aria-label="Precio máximo">
    </div>
  </header>

  <main>
    <div id="meta" class="meta"></div>
    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="more" class="more"></div>
    <div id="empty" class="empty hidden"></div>
  </main>
  <section id="mapView" class="mapview hidden" aria-label="Mapa">
    <div id="map"></div>
    <div id="mapNote" class="mapnote"></div>
  </section>

  <!-- Filtros -->
  <dialog id="filters" class="sheet">
    <form method="dialog" id="filterForm">
      <h2>Filtros</h2>
      <fieldset>
        <legend>Tipo</legend>
        <div class="chips wrap" id="typeChips"></div>
      </fieldset>
      <fieldset>
        <legend>Ambientes</legend>
        <div class="chips" id="roomChips"><button type="button" data-v="" class="chip on">Todos</button><button type="button" data-v="1" class="chip">1+</button><button type="button" data-v="2" class="chip">2+</button><button type="button" data-v="3" class="chip">3+</button><button type="button" data-v="4" class="chip">4+</button><button type="button" data-v="5" class="chip">5+</button></div>
      </fieldset>
      <fieldset>
        <legend>Dormitorios</legend>
        <div class="chips" id="bedChips"><button type="button" data-v="" class="chip on">Todos</button><button type="button" data-v="1" class="chip">1+</button><button type="button" data-v="2" class="chip">2+</button><button type="button" data-v="3" class="chip">3+</button><button type="button" data-v="4" class="chip">4+</button></div>
      </fieldset>
      <fieldset>
        <legend>Baños</legend>
        <div class="chips" id="bathChips"><button type="button" data-v="" class="chip on">Todos</button><button type="button" data-v="1" class="chip">1+</button><button type="button" data-v="2" class="chip">2+</button><button type="button" data-v="3" class="chip">3+</button></div>
      </fieldset>
      <fieldset>
        <legend>Superficie total (m²)</legend>
        <div class="row">
          <input name="atmin" type="number" inputmode="numeric" placeholder="Mínimo">
          <input name="atmax" type="number" inputmode="numeric" placeholder="Máximo">
        </div>
      </fieldset>
      <fieldset>
        <legend>Superficie cubierta (m²)</legend>
        <div class="row">
          <input name="acmin" type="number" inputmode="numeric" placeholder="Mínimo">
          <input name="acmax" type="number" inputmode="numeric" placeholder="Máximo">
        </div>
      </fieldset>
      <fieldset>
        <legend>Características</legend>
        <div class="chips wrap" id="featChips"><button type="button" data-v="credito" class="chip">Apto crédito</button><button type="button" data-v="cochera" class="chip">Cochera</button><button type="button" data-v="balcon" class="chip">Balcón</button><button type="button" data-v="patio" class="chip">Patio</button></div>
        <p class="hint">Se marca cuando el portal o el título del aviso lo dicen. Algunos avisos lo tienen y no lo aclaran.</p>
      </fieldset>
      <fieldset>
        <legend>Portales</legend>
        <div class="chips wrap" id="sourceChips"></div>
      </fieldset>
      <fieldset>
        <legend>Ordenar por</legend>
        <select name="sort">
          <option value="new">Más nuevos primero</option>
          <option value="price_asc">Precio: menor a mayor</option>
          <option value="price_desc">Precio: mayor a menor</option>
          <option value="m2_asc">Precio por m²: menor a mayor</option>
          <option value="area_desc">Más grandes primero</option>
        </select>
      </fieldset>
      <label class="check"><input type="checkbox" name="photos"> Solo con fotos</label>
      <label class="check"><input type="checkbox" name="showHidden"> Mostrar los que descarté</label>
      <div class="actions">
        <button type="button" id="resetFilters" class="ghost">Limpiar</button>
        <button value="ok" class="primary">Ver resultados</button>
      </div>
    </form>
  </dialog>

  <!-- Detalle -->
  <dialog id="detail" class="sheet detail"></dialog>

  <!-- Estado de fuentes -->
  <dialog id="sources" class="sheet"></dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
