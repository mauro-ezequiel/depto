name: Probar portales

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script de prueba
        default: tools/probe.mjs

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ${{ inputs.script || 'tools/probe.mjs' }}
      - name: Guardar resultado
        run: |
          git config user.name "depto-bot"
          git config user.email "depto-bot@users.noreply.github.com"
          git add -f debug
          git commit -m "Prueba de portales" || exit 0
          git pull --rebase origin main
          git push
