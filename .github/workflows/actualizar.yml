name: Actualizar avisos y publicar

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
    inputs:
      debug:
        description: "Guardar muestras crudas en debug/ para ajustar los lectores"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "collector/**", ".github/workflows/actualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # La base completa de avisos se guarda en la caché de Actions (no en git: pesa mucho)
      - name: Recuperar base de avisos
        uses: actions/cache/restore@v4
        with:
          path: state
          key: depto-state-${{ github.run_id }}
          restore-keys: depto-state-
      - name: Leer portales
        if: github.event_name != 'push'
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          DEBUG_DUMP: ${{ inputs.debug && '1' || '' }}
        run: node collector/collect.mjs
      - name: Solo publicar (cambio de código)
        if: github.event_name == 'push'
        run: node collector/collect.mjs --solo-publicar
      - name: Guardar base de avisos
        if: github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: state
          key: depto-state-${{ github.run_id }}
      - name: Guardar muestras de debug
        if: inputs.debug
        run: |
          git config user.name "depto-bot"
          git config user.email "depto-bot@users.noreply.github.com"
          git add -f debug
          git commit -m "Muestras de debug" || exit 0
          git pull --rebase origin main
          git push
      - name: Resumen
        run: |
          ls -la web/data
          node -e '
            const s = require("./web/data/status.json");
            const src = Object.entries(s.sources).map(([k, v]) => `${k}=${v.ok ? v.count : "x"}`).join(" ");
            const kb = (op) => Math.round(s.files[op].reduce((t, x) => t + require("fs").statSync("web/data/" + x.f).size, 0) / 1024);
            console.log(`::notice title=Resumen::total=${s.total} venta=${s.total_venta} alquiler=${s.total_alquiler} ubicados=${s.with_location} ${src} kb_venta=${kb("venta")} kb_alquiler=${kb("alquiler")}`);
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
